
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #e8efff;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            text-align: center;
            color: #2449a5;
        }

        p {
            text-align: center;
            color: gray;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .field {
            flex: 1;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2449a5;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2449a5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #173477;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Registration</h2>
        <p>Fill in your details to register</p>

        <form>

            <div class="row">
                <div class="field">
                    <label>First Name</label>
                    <input type="text" placeholder="First Name" required>
                </div>

                <div class="field">
                    <label>Last Name</label>
                    <input type="text" placeholder="Last Name" required>
                </div>
            </div>

            <div class="field">
                <label>Email Address</label>
                <input type="email" placeholder="Enter email" required>
            </div>

            <div class="row">
                <div class="field">
                    <label>Password</label>
                    <input type="password" placeholder="Password" required>
                </div>

                <div class="field">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Phone number">
                </div>
            </div>

            <div class="field">
                <label>Date of Birth</label>
                <input type="date">
            </div>

            <div class="field">
                <label>Gender</label>
                <select>
                    <option>Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="field">
                <label>Address</label>
                <textarea rows="3" placeholder="Enter your address"></textarea>
            </div>

            <button type="submit">Register Now</button>

        </form>

    </div>

</body>
</html>
