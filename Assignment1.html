<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("IMAGE.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            position: absolute;
            bottom: 50px;
            left: 8%;
            right: 6%;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 30px;
        }

        .left {
            width: 40%;
        }

        .left h2 {
            letter-spacing: 6px;
            font-size: 22px;
        }

        .left p {
            line-height: 1.6;
        }

        .item {
            text-align: center;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">
            <h2>TRAVEL SERVICES</h2>
            <p>
                Find the best possible deals and explore new
                destinations around the world.
            </p>
        </div>

        <div class="item">
            <h2>LOCATION</h2>
        </div>

        <div class="item">
            <h2>Travel the Desert</h2>
        </div>

        <div class="item">
            <h2>Rate the Travelling</h2>
        </div>

    </div>

</body>
</html>
