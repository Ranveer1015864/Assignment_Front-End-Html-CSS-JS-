<!DOCTYPE html>
<html>
<head>
    <title>Maharashtra Voting Day</title>
</head>
<body style="margin:0; padding:20px; background:linear-gradient(to right,#cf6b44,#39322d,#705dea); color:white; font-family:Arial,sans-serif;">

    <h1>Maharashtra Voting Day</h1>

    <form>
        <fieldset>
            <legend>Voter Registration Form</legend>

            <label>Voter Name:</label>
            <input type="text" name="votername"
                   required placeholder="Full Name">
            <br><br>

            
                    <label>Age:</label>
                    <input type="number" name="age"
                        required min="18" placeholder="Enter Age">
                    <br><br>

                    
            <label>Email:</label>
            <input type="email" name="email"
                   required placeholder="Enter Email Address">
            <br><br>

            <label>Voter ID:</label>
            <input type="text" name="voterid"
                   required placeholder="Enter Voter ID">
            <br><br>

            <input type="submit" value="Register">
        </fieldset>
    </form>

    <br>

    <form>
        <fieldset>
            <legend>Select Your Candidate</legend>

            <input type="radio" id="bjp"
                   name="candidate" value="BJP" required>
            <label for="bjp">Bharatiya Janata Party</label>
            <br><br>

            <input type="radio" id="aap"
                   name="candidate" value="AAP">
            <label for="aap">Aam Aadmi Party</label>
            <br><br>

            <input type="radio" id="congress"
                   name="candidate" value="Congress">
            <label for="congress">  Congress "Not Suggested"</label>
            <br><br>

            <input type="radio" id="ujp"
                   name="candidate" value="UJP">
            <label for="ujp">Upgrad Janta Party</label>
            <br><br>

            <input type="radio" id="tvk"
                   name="candidate" value="TVK">
            <label for="tvk">Vijay Thala Party</label>
            <br><br>

            <input type="submit" value="Submit Vote">
            <input type="reset" value="Reset">

        </fieldset>
    </form>

    <br>


    <img src="https://ecisveep.nic.in/uploads/monthly_2019_06/large.Marathi-43-Madha.jpg.a50001951fe40b918cf262fc26bb82ea.jpg" width="1450" height="700">
</body>
</html>


</body>
</html>
