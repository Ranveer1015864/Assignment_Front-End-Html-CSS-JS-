<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

// Parent Class
class Employee {

    constructor(name, id, salary) {
        this.name = name;
        this.id = id;
        this.salary = salary;
    }

    displayDetails() {
        console.log("Name: " + this.name);
        console.log("ID: " + this.id);
        console.log("Salary: " + this.salary);
    }
}

// Teacher Class
class Teacher extends Employee {

    constructor(name, id, salary, subjectTaught) {
        super(name, id, salary);
        this.subjectTaught = subjectTaught;
    }

    teach() {
        console.log("Subject: " + this.subjectTaught);
    }
}

// Administrator Class
class Administrator extends Employee {

    constructor(name, id, salary, department) {
        super(name, id, salary);
        this.department = department;
    }

    manage() {
        console.log("Department: " + this.department);
    }
}

// Support Staff Class
class SupportStaff extends Employee {

    constructor(name, id, salary, supportArea) {
        super(name, id, salary);
        this.supportArea = supportArea;
    }

    provideSupport() {
        console.log("Support Area: " + this.supportArea);
    }
}

// Creating Objects
let teacher = new Teacher("Rahul", 101, 40000, "JavaScript");

let admin = new Administrator("Amit", 102, 50000, "Office");

let staff = new SupportStaff("Raj", 103, 25000, "IT Support");

// Display Details
console.log("--- Teacher Details ---");
teacher.displayDetails();
teacher.teach();

console.log("--- Administrator Details ---");
admin.displayDetails();
admin.manage();

console.log("--- Support Staff Details ---");
staff.displayDetails();
staff.provideSupport();

    </script>
    
</body>
</html>
